name: 🪳 Auto Update Cockroach Jobs

on:
  schedule:
    # Runs EVERY HOUR (on the hour, UTC) — fresh jobs all day
    - cron: '0 * * * *'
  workflow_dispatch:

# Never let two hourly runs overlap and fight over the same push
concurrency:
  group: auto-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Run Auto Updater Script
        run: python scripts/auto_updater.py

      - name: 💾 Commit & Push New Jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_data.json
          if git diff --staged --quiet; then
            echo "No new jobs discovered. Everything is up to date."
          else
            git commit -m "🪳 Auto-update: Fresh Govt Jobs & Results [skip ci]"
            git push
          fi
